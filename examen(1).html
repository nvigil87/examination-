<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Examination</title>
<style>
  :root {
    --paper: #EAE3D3;
    --paper-dark: #DDD4BE;
    --ink: #1E2B24;
    --ink-soft: #3C4A41;
    --burgundy: #6B2737;
    --burgundy-dim: #8A4657;
    --gold: #A8874F;
    --rule: #C7BC9F;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', serif;
    overflow-x: hidden;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  header {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--rule);
  }
  header .mark { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); }
  header h1 { font-size: 21px; margin: 2px 0 0; font-weight: 400; letter-spacing: 0.02em; }
  nav { display: flex; gap: 0; border-bottom: 1px solid var(--rule); }
  nav button {
    flex: 1; background: none; border: none; padding: 12px 4px;
    font-family: Georgia, serif; font-size: 13px; letter-spacing: 0.04em;
    color: var(--ink-soft); border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  nav button.active { color: var(--burgundy); border-bottom-color: var(--burgundy); font-weight: bold; }

  main { flex: 1; padding: 20px; padding-bottom: 60px; }
  section { display: none; }
  section.active { display: block; }

  .big-btn {
    display: block; width: 100%; padding: 20px; margin-top: 8px;
    background: var(--burgundy); color: var(--paper); border: none; border-radius: 3px;
    font-family: Georgia, serif; font-size: 17px; letter-spacing: 0.03em;
    cursor: pointer;
  }
  .big-btn:active { background: var(--burgundy-dim); }
  .small-btn {
    background: none; border: 1px solid var(--rule); color: var(--ink-soft);
    padding: 9px 14px; font-family: Georgia, serif; font-size: 13px; border-radius: 2px; cursor: pointer;
  }

  /* ---------- Examination flow (fullscreen overlay) ---------- */
  #flow {
    display: flex; position: fixed; inset: 0; background: var(--ink); color: var(--paper);
    z-index: 50; flex-direction: column; justify-content: center; align-items: center;
    padding: 32px; text-align: center; cursor: pointer;
  }
  #flow.hide { display: none; }
  #flow .step-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
  #flow .step-name { font-size: 16px; letter-spacing: 0.06em; color: var(--paper); opacity: 0.75; margin-bottom: 20px; }
  #flow .step-text { font-size: 22px; line-height: 1.55; max-width: 480px; }
  #flow .step-text.compact { font-size: 18px; line-height: 1.5; }
  #flow .step-note { font-size: 13px; color: var(--paper); opacity: 0.55; margin-top: 26px; max-width: 440px; line-height: 1.5; }
  #flow .tap-hint { position: absolute; bottom: 34px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.4; }
  #flow .dots { position: absolute; top: 24px; display: flex; gap: 8px; }
  #flow .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--paper); opacity: 0.25; }
  #flow .dots span.on { opacity: 1; background: var(--gold); }

  /* ---------- Tracker ---------- */
  .fault-select { display: flex; gap: 8px; margin-bottom: 18px; }
  .fault-select input {
    flex: 1; font-family: Georgia, serif; font-size: 16px; padding: 10px;
    background: var(--paper-dark); border: 1px solid var(--rule); border-radius: 2px; color: var(--ink);
  }
  .tally-day {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .tally-day .d { font-size: 13px; color: var(--ink-soft); width: 60px; }
  .tally-marks { flex: 1; display: flex; gap: 10px; justify-content: center; align-items: center; }
  .slot { text-align: center; }
  .slot .slot-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); margin-bottom: 4px; }
  .slot-btns { display: flex; align-items: center; gap: 6px; }
  .slot-btns button {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--burgundy);
    background: none; color: var(--burgundy); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .slot-btns .count { min-width: 18px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }

  .chart-wrap { margin-top: 8px; }
  .chart-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .bar-row .bd { font-size: 10px; width: 34px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .bar-track { flex: 1; background: var(--paper-dark); border-radius: 2px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--burgundy); }
  .bar-total { font-size: 11px; width: 20px; color: var(--ink-soft); }

  .empty-note { font-size: 13px; color: var(--ink-soft); font-style: italic; padding: 20px 0; text-align: center; }
  .save-flash { font-size: 11px; color: var(--gold); text-align: center; height: 14px; margin-top: 6px; }

  /* ---------- Notes ---------- */
  .notes-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; }
  #notesArea {
    width: 100%; min-height: 120px; font-family: Georgia, serif; font-size: 15px; line-height: 1.5;
    padding: 12px; background: var(--paper-dark); border: 1px solid var(--rule); border-radius: 2px;
    color: var(--ink); resize: vertical;
  }
  .notes-row { display: flex; justify-content: flex-end; margin-top: 8px; margin-bottom: 24px; }
  .clear-btn {
    background: none; border: 1px solid var(--burgundy-dim); color: var(--burgundy);
    padding: 8px 12px; font-family: Georgia, serif; font-size: 12px; border-radius: 2px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">Examination</div>
    <h1>Examination of Conscience</h1>
  </header>

  <nav>
    <button class="active" data-tab="tracker">Particular</button>
    <button data-tab="history">Past Month</button>
  </nav>

  <main>
    <!-- TRACKER -->
    <section id="tracker" class="active">
      <div class="fault-select">
        <input id="faultInput" type="text" placeholder="Fault you are working on...">
        <button class="small-btn" onclick="saveFault()">Save</button>
      </div>
      <div id="todayTally"></div>
      <div class="save-flash" id="saveFlash"></div>
    </section>

    <!-- HISTORY -->
    <section id="history">
      <div class="notes-title">Notes</div>
      <textarea id="notesArea" placeholder="Notes for your examination..." oninput="saveNotes()"></textarea>
      <div class="notes-row">
        <button class="clear-btn" onclick="clearAll()">Clear notes &amp; fault history</button>
      </div>
      <div class="chart-wrap">
        <div class="chart-title" id="historyTitle">Past 30 days</div>
        <div id="historyChart"></div>
      </div>
    </section>
  </main>
</div>

<!-- FULLSCREEN EXAMINATION FLOW -->
<div id="flow">
  <div class="dots" id="dots"></div>
  <div class="step-eyebrow" id="stepEyebrow"></div>
  <div class="step-name" id="stepName"></div>
  <div class="step-text" id="stepText"></div>
  <div class="step-note" id="stepNote"></div>
  <div class="tap-hint" id="tapHint">tap to continue -- swipe up to exit</div>
</div>

<script>
// ---------------- Data: the General Examination, as Ignatius wrote it (Mullan translation, 1914, public domain) ----------------
const STEPS = [
  {
    name: "First Point",
    text: "To give thanks to God our Lord for the benefits received.",
    note: ""
  },
  {
    name: "Second Point",
    text: "To ask grace to know my sins and cast them out.",
    note: ""
  },
  {
    name: "Third Point",
    text: "To ask account of my soul, hour by hour, from rising until now -- first as to thoughts, then words, then deeds.",
    note: "A thought alone is not a sin -- only consenting to it or acting on it."
  },
  {
    name: "Fourth Point",
    text: "To ask pardon of God our Lord for the faults.",
    note: ""
  },
  {
    name: "Fifth Point",
    text: "To purpose amendment with His grace.",
    note: ""
  },
  {
    name: "Closing",
    text: "Say an Our Father.",
    note: ""
  }
];

let flowIndex = 0;
let currentFault = "";

// ---------------- Utility ----------------
function todayKey(d) {
  const dt = d || new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`; // local calendar date, not UTC
}

// ---------------- Tab switching ----------------
function switchTab(tab) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelector(`nav button[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'tracker') renderTracker();
  if (tab === 'history') renderHistory();
}
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

// ---------------- Settings (fault + notes) ----------------
function loadSettings() {
  try {
    const raw = localStorage.getItem('examen_settings');
    if (raw) {
      const s = JSON.parse(raw);
      if (s.fault) currentFault = s.fault;
    }
  } catch (e) { console.error('load settings failed', e); }
  updateFaultDisplay();
}
function saveSettings() {
  try {
    localStorage.setItem('examen_settings', JSON.stringify({ fault: currentFault }));
  } catch (e) { console.error('save settings failed', e); }
}
function updateFaultDisplay() {
  document.getElementById('faultInput').value = currentFault;
  document.getElementById('historyTitle').textContent = currentFault ? `Past 30 days -- ${currentFault}` : 'Past 30 days';
}

function loadNotes() {
  try {
    document.getElementById('notesArea').value = localStorage.getItem('examen_notes') || '';
  } catch (e) { console.error('load notes failed', e); }
}
function saveNotes() {
  try {
    localStorage.setItem('examen_notes', document.getElementById('notesArea').value);
  } catch (e) { console.error('save notes failed', e); }
}

function clearAll() {
  try {
    localStorage.removeItem('examen_notes');
    localStorage.removeItem('examen_tallies');
    localStorage.removeItem('examen_settings');
  } catch (e) { console.error('clear failed', e); }
  talliesCache = {};
  currentFault = '';
  document.getElementById('notesArea').value = '';
  updateFaultDisplay();
  renderHistory();
}

// ---------------- General Examination flow ----------------
function startFlow() {
  flowIndex = 0;
  renderFlowStep();
  document.getElementById('flow').classList.remove('hide');
}
function closeFlow() {
  document.getElementById('flow').classList.add('hide');
}
function nextStep() {
  flowIndex++;
  if (flowIndex >= STEPS.length) {
    closeFlow();
    return;
  }
  renderFlowStep();
}
function renderFlowStep() {
  const s = STEPS[flowIndex];
  document.getElementById('stepEyebrow').textContent = `${flowIndex+1} of ${STEPS.length}`;
  document.getElementById('stepName').textContent = s.name;
  const stepTextEl = document.getElementById('stepText');
  stepTextEl.textContent = s.text;
  stepTextEl.classList.toggle('compact', s.text.length > 90);
  document.getElementById('stepNote').textContent = s.note;
  document.getElementById('tapHint').textContent = flowIndex === STEPS.length-1 ? 'tap to finish -- swipe up to exit' : 'tap to continue -- swipe up to exit';
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  STEPS.forEach((_, i) => {
    const d = document.createElement('span');
    if (i === flowIndex) d.className = 'on';
    dots.appendChild(d);
  });
}

// Tap anywhere to advance; swipe up to exit early.
const flowEl = document.getElementById('flow');
let touchStartY = null;
let touchHandled = false;
flowEl.addEventListener('touchstart', (e) => {
  touchStartY = e.changedTouches[0].clientY;
});
flowEl.addEventListener('touchend', (e) => {
  if (touchStartY === null) return;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartY = null;
  touchHandled = true; // suppress the synthetic click that follows this touch
  e.preventDefault();
  if (dy < -60) {
    closeFlow();
  } else {
    nextStep();
  }
});
// Mouse click fallback for non-touch devices only -- skip if a touch just handled this tap
flowEl.addEventListener('click', () => {
  if (touchHandled) { touchHandled = false; return; }
  nextStep();
});

// ---------------- Particular Examination tracker ----------------
// All tally data lives in ONE storage key (a map of date -> {morning, evening}).
// An in-memory cache is warmed once and kept current locally; writes are
// synchronous, so every write completes instantly -- no reload race condition.
let talliesCache = null; // { "2026-07-08": {morning:1, evening:0}, ... }

function loadAllTallies() {
  if (talliesCache) return talliesCache;
  try {
    const raw = localStorage.getItem('examen_tallies');
    talliesCache = raw ? JSON.parse(raw) : {};
  } catch (e) {
    console.error('load tallies failed', e);
    talliesCache = {};
  }
  return talliesCache;
}
function saveTallies() {
  try {
    localStorage.setItem('examen_tallies', JSON.stringify(talliesCache));
    return true;
  } catch (e) {
    console.error('tally save failed', e);
    return false;
  }
}

function saveFault() {
  currentFault = document.getElementById('faultInput').value.trim();
  saveSettings();
  updateFaultDisplay();
  flash('Saved.');
  renderTracker();
}

function renderTracker() {
  const all = loadAllTallies();
  const t = all[todayKey()] || { morning: 0, evening: 0 };
  const el = document.getElementById('todayTally');
  el.innerHTML = `
    <div class="tally-day" style="border-top:1px solid var(--rule);">
      <div class="d">Today</div>
      <div class="tally-marks">
        <div class="slot">
          <div class="slot-label">Midday check</div>
          <div class="slot-btns">
            <button onclick="adjustTally('morning',-1)">-</button>
            <div class="count" id="cnt-morning">${t.morning}</div>
            <button onclick="adjustTally('morning',1)">+</button>
          </div>
        </div>
        <div class="slot">
          <div class="slot-label">Night check</div>
          <div class="slot-btns">
            <button onclick="adjustTally('evening',-1)">-</button>
            <div class="count" id="cnt-evening">${t.evening}</div>
            <button onclick="adjustTally('evening',1)">+</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function adjustTally(slot, delta) {
  const all = loadAllTallies();
  const key = todayKey();
  const t = all[key] || { morning: 0, evening: 0 };
  t[slot] = Math.max(0, (t[slot] || 0) + delta);
  all[key] = t;
  talliesCache = all;
  document.getElementById('cnt-'+slot).textContent = t[slot];
  const ok = saveTallies();
  flash(ok ? 'Recorded.' : 'Could not save');
}

function flash(msg) {
  const f = document.getElementById('saveFlash');
  f.textContent = msg;
  setTimeout(() => { if (f.textContent === msg) f.textContent = ''; }, 1200);
}

// ---------------- History (past 30 days) ----------------
function renderHistory() {
  const el = document.getElementById('historyChart');
  const all = loadAllTallies();
  const days = [];
  const now = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const results = days.map(d => {
    const t = all[todayKey(d)] || { morning: 0, evening: 0 };
    return { date: d, total: (t.morning||0) + (t.evening||0) };
  });
  const max = Math.max(1, ...results.map(r => r.total));
  const anyData = results.some(r => r.total > 0);
  if (!anyData) {
    el.innerHTML = '<div class="empty-note">No entries recorded yet this month.</div>';
    return;
  }
  el.innerHTML = results.map(r => {
    const label = r.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const pct = Math.round((r.total / max) * 100);
    return `
      <div class="bar-row">
        <div class="bd">${label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-total">${r.total}</div>
      </div>
    `;
  }).join('');
}

// ---------------- Init ----------------
loadSettings();
loadNotes();
startFlow();
</script>
</body>
</html>
